  <style>
    /* Premium project details styling */
    .project-detail-hero {
      position: relative;
      height: 60vh;
      min-height: 400px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: flex-end;
      padding-bottom: 60px;
      color: #fff;
    }
    .project-detail-hero::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.8) 100%);
    }
    .project-detail-hero .shell {
      position: relative;
      z-index: 2;
    }
    .project-detail-hero h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 700;
    }
    .project-detail-hero p {
      margin: 0;
      font-size: clamp(14px, 2vw, 18px);
      color: var(--gold, #8f7b4b);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .project-metadata-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 30px;
      background: var(--light-warm, #f8f6f0);
      padding: 30px;
      border-radius: var(--radius, 8px);
      margin: -40px 0 40px;
      position: relative;
      z-index: 3;
      border: 1px solid rgba(143, 123, 75, 0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
    }
    .metadata-item h4 {
      margin: 0 0 5px;
      color: var(--muted, #666);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .metadata-item p {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: var(--dark, #222);
    }
    
    .project-description {
      font-size: 18px;
      line-height: 1.8;
      color: var(--body, #444);
      margin-bottom: 50px;
      white-space: pre-line;
    }
    
    .detail-section-title {
      font-size: 24px;
      font-weight: 700;
      margin: 60px 0 30px;
      border-bottom: 2px solid var(--gold, #8f7b4b);
      padding-bottom: 10px;
      display: inline-block;
    }
    
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }
    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius, 8px);
      aspect-ratio: 3/2;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      cursor: pointer;
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .gallery-item:hover img {
      transform: scale(1.05);
    }
    
    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      height: 0;
      overflow: hidden;
      border-radius: var(--radius, 8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      margin-bottom: 50px;
      background: #000;
    }
    .video-container video, .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    
    .action-buttons-container {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 60px;
    }
    .btn-detail-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      background: var(--gold, #8f7b4b);
      color: #fff !important;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      transition: background 0.3s ease, transform 0.2s ease;
      border: none;
      cursor: pointer;
    }
    .btn-detail-action:hover {
      background: var(--gold-dark, #76653e);
      transform: translateY(-2px);
    }
    .btn-detail-secondary {
      background: transparent;
      color: var(--gold, #8f7b4b) !important;
      border: 1px solid var(--gold, #8f7b4b);
    }
    .btn-detail-secondary:hover {
      background: var(--gold, #8f7b4b);
      color: #fff !important;
    }
    
    .draft-warning-container {
      text-align: center;
      padding: 100px 20px;
    }
    .draft-warning-container h2 {
      font-size: 32px;
      margin-bottom: 20px;
      color: #d9534f;
    }
    .draft-warning-container p {
      font-size: 18px;
      color: var(--muted, #666);
      margin-bottom: 30px;
    }
  </style>
</head>
